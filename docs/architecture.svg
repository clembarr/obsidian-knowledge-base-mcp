<text x="40" y="1124" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#495057" xml:space="preserve">Aucun service externe : ni base de données, ni HTTP, ni plugin Obsidian.</text>
<text x="40" y="1143" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#495057" xml:space="preserve">Le vault entier est lisible ; seul le dossier projets est modifiable.</text>
